# SonarQube Cloud analysis scope, generated from this repository's real layout.
#
# Source roots are stated explicitly rather than discovered. Left to discovery the scanner
# also reads build output and reports duplication between a source file and its own bundle
# — measured on theokit-tui (B-126).

sonar.projectKey=usetheokit_theokit-plugins
sonar.organization=usetheokit

sonar.sources=integration/src,packages/auth-github/src,packages/auth-google/src,packages/auth-magic-link/src,packages/plugin-canvas/src,packages/plugin-copilot/src,packages/plugin-db-drizzle/src,packages/plugin-email/src,packages/plugin-forms/src,packages/plugin-payments/src,packages/plugin-realtime/src,packages/plugin-voice/src
sonar.tests=integration/tests,packages/auth-github/tests,packages/auth-google/tests,packages/auth-magic-link/tests,packages/plugin-canvas/tests,packages/plugin-copilot/tests,packages/plugin-db-drizzle/tests,packages/plugin-email/tests,packages/plugin-forms/tests,packages/plugin-payments/tests,packages/plugin-realtime/tests,packages/plugin-voice/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.stories.tsx,wiki/**

# Written by the coverage run. A path listed here that the build never writes reports
# 0% while the suite is green, and that number is indistinguishable from a measured one.
sonar.javascript.lcov.reportPaths=integration/coverage/lcov.info,packages/auth-github/coverage/lcov.info,packages/auth-google/coverage/lcov.info,packages/auth-magic-link/coverage/lcov.info,packages/plugin-canvas/coverage/lcov.info,packages/plugin-copilot/coverage/lcov.info,packages/plugin-db-drizzle/coverage/lcov.info,packages/plugin-email/coverage/lcov.info,packages/plugin-forms/coverage/lcov.info,packages/plugin-payments/coverage/lcov.info,packages/plugin-realtime/coverage/lcov.info,packages/plugin-voice/coverage/lcov.info

sonar.sourceEncoding=UTF-8
