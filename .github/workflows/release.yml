name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release via Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Actions pinned by commit SHA rather than by ref, because this job publishes as this
      # organization and a moving ref decides what runs here. `changesets/action@v1` was the
      # sharpest edge: `v1` is not a tag in that repository, it is a BRANCH — the tag lookup
      # returns 404 and the branch head is what resolves — so any push to it changed the code
      # running in this job, with no release and no version bump to notice.
      #
      # Each pin carries the version it resolved to on 2026-08-21, read from the action's own
      # tags rather than assumed from the ref name. Majors are deliberately unchanged: pinning
      # freezes what already runs, upgrading is a separate decision with its own risk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # The one checkout in this repository that keeps its credential, and not
          # by oversight: changesets/action pushes the version commit and the
          # release tags with the git CLI, which authenticates from exactly this
          # persisted token. `persist-credentials: false` breaks the release.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
          registry-url: 'https://registry.npmjs.org'
      # `changeset publish` shells out to `npm publish`, and OIDC trusted publishing
      # landed in npm 11.5.1. Node 22 ships npm 10.9.7, which has no OIDC code at all:
      # measured by unpacking the tarballs and grepping lib/ for
      # ACTIONS_ID_TOKEN_REQUEST_URL — 10.9.7 → 0 files, 11.4.1 → 0, 11.5.1 → 2.
      #
      # Without it the CLI never presents the OIDC token, publishes unauthenticated,
      # and the registry answers `E404 Not Found - PUT` — it returns 404 rather than
      # 403 so it does not reveal that a package exists to someone who cannot publish
      # it. That reads as "package does not exist" and sends you looking for a typo or
      # a missing trusted-publisher binding instead of a CLI too old to use one. It
      # cost two failed publishes of an already-correct release (#29).
      #
      # NOT redundant with the trusted-publisher binding on npmjs.com: both halves are
      # required — the binding authorizes this workflow, this line is what lets the CLI
      # present the token the binding checks.
      - name: Upgrade npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@11.9.0 # zizmor: ignore[adhoc-packages] — bootstrapping npm itself; no lockfile can cover it
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # This job and ci.yml trigger on the SAME event (`push` to main) and run in parallel,
      # with nothing linking them — so before this, `changeset publish` could reach npm while
      # CI was still running on the very same SHA, or while it was failing on it. The merge of
      # the "Version Packages" PR creates a new commit that neither branch's CI had seen.
      #
      # Not hypothetical here: plugin-canvas@0.3.3 and plugin-forms@0.1.4 sat broken in the
      # registry for weeks (#9). Running the gates in this job costs a couple of minutes and
      # makes the guarantee independent of what CI happens to be doing (#112).
      #
      # This is NOT a substitute for branch protection requiring a status check (#26): that
      # protects the merge, this protects the publish.
      - name: Typecheck the commit being released
        run: pnpm typecheck
      - name: Test the commit being released
        run: pnpm test
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          # `pnpm run version:packages`, never `pnpm version`. `version` is a native
          # npm/pnpm command: invoked without a semver argument it prints
          # process.versions and exits 0 WITHOUT running the package script of the
          # same name. That is what this input said until 2026-08-17, so
          # `changeset version` never ran: every release pushed a
          # changeset-release/main branch identical to main, with the changesets
          # unconsumed and no version bumped — while the step still looked like it
          # had worked. The script was renamed off the reserved word so the trap
          # cannot be re-armed by someone dropping the `run`.
          version: pnpm run version:packages
        env:
          # RELEASE_PAT first, GITHUB_TOKEN as the fallback (#16).
          #
          # Opening the "Version Packages" PR needs a token allowed to create pull
          # requests, and GITHUB_TOKEN is not — the ORGANISATION setting "Allow
          # GitHub Actions to create and approve pull requests" is `false`, and it
          # is a ceiling: a repository cannot override it (measured, the API answers
          # 409 "The organization does not allow GitHub Actions to create or approve
          # pull requests").
          #
          # Two ways out, and this line takes the safer one without demanding it.
          # Flipping the org flag would also grant Actions the ability to APPROVE
          # pull requests, in every repository of the org — a review-bypass vector
          # next to required reviews. A PAT (or GitHub App token) in RELEASE_PAT
          # confines the grant to this workflow. Absent the secret this expression
          # falls back and the release behaves exactly as before, so adding it is
          # the only step needed and nothing breaks meanwhile.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # NPM_TOKEN intentionally absent — per technical-hardening-sprint plan v1.1 EC-2
          # absorbed: NPM_TOKEN env DISABLES OIDC trusted-publisher binding silently.
          # npm CLI prioritizes token auth over the OIDC token from id-token: write
          # permission, so --provenance silently no-ops. Without NPM_TOKEN, npm CLI
          # uses the GitHub Actions OIDC token automatically (requires npm dashboard
          # trusted-publisher binding configured at npmjs.com/package/<pkg>/settings).
          #
          # NPM_CONFIG_PROVENANCE is gone for a related reason: it is redundant now
          # that `publishConfig.provenance: true` sits in all eleven manifests,
          # beside the package each one describes, and trusted publishing attaches
          # the attestation on its own.
      # The failure this closes is silence, not the missing permission (#16).
      #
      # When the token cannot open a pull request, `changesets/action` still
      # pushes `changeset-release/main` and the job still goes GREEN. The
      # changesets sit unconsumed, no version is bumped, and the only signal is a
      # branch nobody is watching — which is how a broken release survived five
      # runs over two months before anyone looked.
      #
      # `hasChangesets` true with an empty `pullRequestNumber` is exactly that
      # state, and it is the only combination worth failing on: no changesets
      # means nothing to release, and a published run has already done its job.
      - name: Fail loudly if the release PR could not be opened
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.pullRequestNumber == '' && steps.changesets.outputs.published != 'true'
        run: |
          echo "::error title=Release PR was not created::changesets pushed the branch but could not open the pull request."
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Release PR was not created

          `changeset-release/main` was pushed and the "Version Packages" pull request was not
          opened, so **no version was bumped and nothing was published**. The changesets are
          still pending.

          The token used cannot create pull requests. Measured: the *organisation* setting
          `Allow GitHub Actions to create and approve pull requests` is `false`, and it is a
          ceiling — a repository cannot override it (the API answers `409 The organization does
          not allow GitHub Actions to create or approve pull requests`).

          ### Two ways to fix it

          **Recommended — a scoped token.** Create a PAT (or GitHub App token) with `repo`
          scope and add it as the `RELEASE_PAT` secret. This workflow already prefers it over
          `GITHUB_TOKEN`, so nothing else changes. The grant stays confined to this workflow.

          **Or — flip the organisation flag**, in Settings → Actions → General. One click, and
          it also grants Actions the ability to **approve** pull requests in *every* repository
          of the organisation, which is a review-bypass vector next to required reviews.

          ### Meanwhile

          Open the pull request by hand from `changeset-release/main` into `main`; the rest of
          the release proceeds normally.

          Tracked in #16.
          SUMMARY
          exit 1
