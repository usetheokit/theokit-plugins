name: CI

# Quality gates for theokit-plugins. The flow is workspace -> develop -> main and BOTH
# promotion legs are pull requests, so both bases are listed — exactly as
# secret-scan.yml already does.
#
# Listing only `main` was a hole, not a theory: a PR based on `develop` ran none of the
# three jobs, so `develop` — the branch whose whole job is to integrate — accepted code
# that had never been checked by CI. Whoever reviewed a promotion saw "all checks
# passed" from a secret scan alone. It hid a `theokit: link:../../../` devDependency
# that made all three jobs impossible to pass on any commit (#13), which in turn hid a
# broken release (#9, #15, #19). Five Release runs failed over two months before the
# first PR based on `main` surfaced it.
#
# `workspace` is deliberately absent from `push`: every promotion out of it is a PR, so
# the pull_request trigger already covers that commit, and adding it here would run the
# same three jobs twice on the same SHA.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Widening the triggers multiplies runs, so supersede in-flight ones. Never cancel on
# `main` or `develop`: those runs are the record of what a protected branch actually
# passed, and the Release workflow keys off main's state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint + Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      # Cross-package imports resolve through each package's `exports` map, which points
      # at `dist/` — so the workspace has to be BUILT before anything type-aware or
      # runtime-loading touches it. Skipping this is invisible on a developer machine
      # that has a stale `dist/` lying around, and fails only in CI: measured here as
      # `Failed to resolve entry for package "@theokit/auth-magic-link"` and as a wall of
      # `type that could not be resolved` from typescript-eslint.
      - name: Build all packages (types the other gates resolve against)
        run: pnpm build

      - name: ESLint (strict — zero warnings)
        run: pnpm lint
      - name: Prettier (format check)
        run: pnpm format:check

  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      # Cross-package imports resolve through each package's `exports` map, which points
      # at `dist/` — so the workspace has to be BUILT before anything type-aware or
      # runtime-loading touches it. Skipping this is invisible on a developer machine
      # that has a stale `dist/` lying around, and fails only in CI: measured here as
      # `Failed to resolve entry for package "@theokit/auth-magic-link"` and as a wall of
      # `type that could not be resolved` from typescript-eslint.
      - name: Build all packages (types the other gates resolve against)
        run: pnpm build

      - run: pnpm typecheck
      - name: Check for circular dependencies (regression guard for the M1 canvas cycle fix)
        run: pnpm check:cycles
      # Catches, on every push, what previously surfaced only at a package's first
      # publish: a missing `repository` (E422 from provenance validation, #34) and a
      # `link:` dependency pointing outside the workspace, which made all three jobs
      # unpassable on any commit (#13).
      - name: Validate package manifests (publishability)
        run: pnpm check:manifests
      # The packaging contract, and the only check that looks at these packages
      # the way a consumer does: every `exports` subpath resolving to a file the
      # tarball actually ships, every declared .d.ts shipped, main entry importing
      # from dist/. Unit tests import from src/ through the workspace, so none of
      # them can see a broken subpath — that is how #9 shipped. The build it needs now
      # runs at the top of this job, ahead of typecheck. Runs here rather
      # than in integration.yml because it needs no credential and no network: a packaging
      # break is ours, not a provider's bad afternoon. Must come AFTER build.
      - name: Consumer smoke (packaging contract, all packages)
        run: pnpm integration:consumer

      # Every integration suite that needs no credential — `tests/consumer/` plus anything named
      # `*.offline.test.ts`. It runs here, on every PR, because a suite the nightly job is
      # the only one to reach is not a gate: a PR goes green past it and the break is
      # found by whoever reads the 04:00 run.
      #
      # `magic-link-delivered.offline.test.ts` is why this step exists — it stands up a
      # real SMTP server, sends real MIME over TCP and reads the link back out of what
      # arrived, catching a quoted-printable break inside the token that no JSON-transport
      # test can see. Zero credentials, zero network beyond localhost.
      #
      # `readiness.test.ts` fails when a credential-free suite is written outside the
      # convention, and when this step stops naming `integration:offline`.
      - name: Offline integration suites (credential-free, every PR)
        run: pnpm integration:offline

      # The documentation gates. They live in this job because two of the three read the
      # EMITTED declarations — `dist/**/*.d.ts` — and are therefore meaningless before the
      # build step above. A docblock in `src/` is not documentation until it survives the
      # rollup: `stripInternal` deletes a declaration outright when `@internal` appears in
      # its leading comments, and the rollup relocates comments on its own. Measured here:
      # the module header of `auth-github/src/index.ts` was re-anchored onto the exported
      # `GitHubAuthError` class, where its `@theokit/...` first line was parsed as a tag and
      # swallowed the whole block. Source-side, that package looked documented; the file a
      # consumer installs had nothing.
      #
      # Order is deliberate. `doc-orphans` reads source only and is the cheapest, so it
      # fails first and points at a line someone can edit. `doc-api` compiles a probe per
      # documented import and is the slowest. Credential-free and network-free — a README
      # that does not compile is ours, not a provider's bad afternoon.
      - name: Documentation gates (drift, orphans, coverage)
        run: pnpm quality:docs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      # Cross-package imports resolve through each package's `exports` map, which points
      # at `dist/` — so the workspace has to be BUILT before anything type-aware or
      # runtime-loading touches it. Skipping this is invisible on a developer machine
      # that has a stale `dist/` lying around, and fails only in CI: measured here as
      # `Failed to resolve entry for package "@theokit/auth-magic-link"` and as a wall of
      # `type that could not be resolved` from typescript-eslint.
      - name: Build all packages (types the other gates resolve against)
        run: pnpm build

      - run: pnpm test
