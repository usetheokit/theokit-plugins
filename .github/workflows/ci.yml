name: CI

# Quality gates for theokit-plugins. The flow is workspace -> develop -> main and BOTH
# promotion legs are pull requests, so both bases are listed — exactly as
# secret-scan.yml already does.
#
# Listing only `main` was a hole, not a theory: a PR based on `develop` ran none of the
# three jobs, so `develop` — the branch whose whole job is to integrate — accepted code
# that had never been checked by CI. Whoever reviewed a promotion saw "all checks
# passed" from a secret scan alone. It hid a `theokit: link:../../../` devDependency
# that made all three jobs impossible to pass on any commit (#13), which in turn hid a
# broken release (#9, #15, #19). Five Release runs failed over two months before the
# first PR based on `main` surfaced it.
#
# `workspace` is deliberately absent from `push`: every promotion out of it is a PR, so
# the pull_request trigger already covers that commit, and adding it here would run the
# same three jobs twice on the same SHA.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Widening the triggers multiplies runs, so supersede in-flight ones. Never cancel on
# `main` or `develop`: those runs are the record of what a protected branch actually
# passed, and the Release workflow keys off main's state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  lint-and-format:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ESLint (strict — zero warnings)
        run: pnpm lint
      - name: Prettier (format check)
        run: pnpm format:check

  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Check for circular dependencies (regression guard for the M1 canvas cycle fix)
        run: pnpm check:cycles
      # Catches, on every push, what previously surfaced only at a package's first
      # publish: a missing `repository` (E422 from provenance validation, #34) and a
      # `link:` dependency pointing outside the workspace, which made all three jobs
      # unpassable on any commit (#13).
      - name: Validate package manifests (publishability)
        run: pnpm check:manifests
      - name: Build all packages
        run: pnpm build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
