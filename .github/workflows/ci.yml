name: CI

# Quality gates for theokit-plugins. The flow is workspace -> develop -> main and BOTH
# promotion legs are pull requests, so both bases are listed — exactly as
# secret-scan.yml already does.
#
# Listing only `main` was a hole, not a theory: a PR based on `develop` ran none of the
# three jobs, so `develop` — the branch whose whole job is to integrate — accepted code
# that had never been checked by CI. Whoever reviewed a promotion saw "all checks
# passed" from a secret scan alone. It hid a `theokit: link:../../../` devDependency
# that made all three jobs impossible to pass on any commit (#13), which in turn hid a
# broken release (#9, #15, #19). Five Release runs failed over two months before the
# first PR based on `main` surfaced it.
#
# `workspace` is deliberately absent from `push`: every promotion out of it is a PR, so
# the pull_request trigger already covers that commit, and adding it here would run the
# same three jobs twice on the same SHA.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Widening the triggers multiplies runs, so supersede in-flight ones. Never cancel on
# `main` or `develop`: those runs are the record of what a protected branch actually
# passed, and the Release workflow keys off main's state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint + Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags, or the release-drift gate is inert exactly where it is wired. `actions/checkout`
          # defaults to `fetch-depth: 1` and fetches with `--no-tags`, so `quality:changelog` took
          # its no-tags branch on every run and reported that it had not checked — honest on
          # stdout, invisible under a green check mark. `fetch-tags` is cheaper than
          # `fetch-depth: 0`, which would pull the whole history for one comparison.
          fetch-tags: true
      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      # Cross-package imports resolve through each package's `exports` map, which points
      # at `dist/` — so the workspace has to be BUILT before anything type-aware or
      # runtime-loading touches it. Skipping this is invisible on a developer machine
      # that has a stale `dist/` lying around, and fails only in CI: measured here as
      # `Failed to resolve entry for package "@theokit/auth-magic-link"` and as a wall of
      # `type that could not be resolved` from typescript-eslint.
      - name: Build all packages (types the other gates resolve against)
        run: pnpm build

      - name: ESLint (strict — zero warnings)
        run: pnpm lint
      - name: Prettier (format check)
        run: pnpm format:check

  typecheck-build:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags, or the release-drift gate is inert exactly where it is wired. `actions/checkout`
          # defaults to `fetch-depth: 1` and fetches with `--no-tags`, so `quality:changelog` took
          # its no-tags branch on every run and reported that it had not checked — honest on
          # stdout, invisible under a green check mark. `fetch-tags` is cheaper than
          # `fetch-depth: 0`, which would pull the whole history for one comparison.
          fetch-tags: true
      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      # Cross-package imports resolve through each package's `exports` map, which points
      # at `dist/` — so the workspace has to be BUILT before anything type-aware or
      # runtime-loading touches it. Skipping this is invisible on a developer machine
      # that has a stale `dist/` lying around, and fails only in CI: measured here as
      # `Failed to resolve entry for package "@theokit/auth-magic-link"` and as a wall of
      # `type that could not be resolved` from typescript-eslint.
      - name: Build all packages (types the other gates resolve against)
        run: pnpm build

      # A changeset reaching `main` makes the next release run FAIL, every time: `release.yml`
      # responds to a push on `main` by running `changeset version` and opening a "Version Packages"
      # pull request, and this organisation does not permit Actions to open one — measured,
      # `actions/secrets` is empty and `can_approve_pull_request_reviews` is false (B-023).
      #
      # The workaround is to cut the versions on `workspace` before promoting, so `hasChangesets` is
      # false when the release runs and the action publishes directly. It was documented in the
      # CHANGELOG and then not applied by the very pull request that documented it, which is how a
      # release run failed on 2026-08-24. A paragraph is not a check.
      #
      # Scoped to promotions: a changeset on a `develop` PR is exactly right and must not be
      # blocked. Only `main` cannot consume one.
      #
      # This used to read "delete this step the day `RELEASE_PAT` exists". That day will not come:
      # `0ca9f7f` wired `release.yml` to mint a token from the `theokit-release` GitHub App, and the
      # PAT it named was never created. An instruction whose trigger cannot occur is an instruction
      # nobody can act on, so it is restated against the condition that actually retires the gate.
      #
      # Retire it when a release here has ACTUALLY opened a Version Packages pull request with the
      # App's token — not when the App is merely configured. The distinction is the whole point: the
      # secrets being present does not prove the App is installed on this repository, nor that its
      # installation grants `contents` and `pull-requests` write. Until one release demonstrates it,
      # the constraint this gate enforces still holds, and removing it on the strength of a
      # configuration change would be reasoning about the mechanism instead of observing it.
      - name: A promotion to main carries no unconsumed changeset
        if: github.base_ref == 'main'
        run: |
          # In prerelease mode `changeset version` APPLIES a changeset and KEEPS its file, recording
          # the name in `.changeset/pre.json` so the bump can be recomputed at `pre exit`. Such a
          # file is consumed — its version bump is already in the manifests — and counting it here
          # would refuse every promotion for as long as the repository stays on the `next` channel.
          # Only a changeset absent from that list is genuinely pending.
          consumed="$(node -e 'try{console.log((require("./.changeset/pre.json").changesets||[]).join("\n"))}catch(e){}' 2>/dev/null || true)"
          pending=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            name="${f%.md}"
            printf '%s\n' "$consumed" | grep -qxF "$name" && continue
            pending="${pending}${f}"$'\n'
          done <<< "$(find .changeset -name '*.md' ! -name 'README.md' -printf '%f\n' 2>/dev/null || true)"
          pending="$(printf '%s' "$pending")"
          if [ -n "$pending" ]; then
            echo "::error title=Changeset would reach main::$pending"
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## A changeset would reach `main`

          `release.yml` cannot open the "Version Packages" pull request in this organisation, so the
          release run that follows this merge would fail at exactly that step. Nothing is published
          and the changesets survive, but the failure is avoidable.

          Cut the versions first, on `workspace`:

          ```
          pnpm run version:packages
          # add the dated section to CHANGELOG.md (rules/release-record.md § 3)
          # then promote: workspace -> develop -> main
          ```

          With no changesets pending, `changesets/action` publishes directly. Tracked in B-023.
          SUMMARY
            exit 1
          fi
          echo "no pending changesets — the release will publish directly"

      - run: pnpm typecheck
      # Not redundant with the `pnpm install --frozen-lockfile` above, and the difference is
      # legibility rather than coverage: when the install step rejects a drifted lockfile, the job
      # fails inside a step named `pnpm install`, and a contributor reads that as "the install
      # broke". A named gate puts the actual condition in the checks list, which is where they look
      # first. It costs under a second on a runner that has already resolved (B-027).
      - name: Lockfile satisfies the workspace manifests
        run: pnpm check:lockfile
      - name: Check for circular dependencies (regression guard for the M1 canvas cycle fix)
        run: pnpm check:cycles
      # Catches, on every push, what previously surfaced only at a package's first
      # publish: a missing `repository` (E422 from provenance validation, #34) and a
      # `link:` dependency pointing outside the workspace, which made all three jobs
      # unpassable on any commit (#13).
      - name: Validate package manifests (publishability)
        run: pnpm check:manifests
      # The packaging contract, and the only check that looks at these packages
      # the way a consumer does: every `exports` subpath resolving to a file the
      # tarball actually ships, every declared .d.ts shipped, main entry importing
      # from dist/. Unit tests import from src/ through the workspace, so none of
      # them can see a broken subpath — that is how #9 shipped. The build it needs now
      # runs at the top of this job, ahead of typecheck. Runs here rather
      # than in integration.yml because it needs no credential and no network: a packaging
      # break is ours, not a provider's bad afternoon. Must come AFTER build.
      - name: Consumer smoke (packaging contract, all packages)
        run: pnpm integration:consumer

      # Every integration suite that needs no credential — `tests/consumer/` plus anything named
      # `*.offline.test.ts`. It runs here, on every PR, because a suite the nightly job is
      # the only one to reach is not a gate: a PR goes green past it and the break is
      # found by whoever reads the 04:00 run.
      #
      # `magic-link-delivered.offline.test.ts` is why this step exists — it stands up a
      # real SMTP server, sends real MIME over TCP and reads the link back out of what
      # arrived, catching a quoted-printable break inside the token that no JSON-transport
      # test can see. Zero credentials, zero network beyond localhost.
      #
      # `readiness.offline.test.ts` fails when a credential-free suite is written outside the
      # convention, and when this step stops naming `integration:offline`.
      - name: Offline integration suites (credential-free, every PR)
        run: pnpm integration:offline

      # The documentation gates. They live in this job because two of the three read the
      # EMITTED declarations — `dist/**/*.d.ts` — and are therefore meaningless before the
      # build step above. A docblock in `src/` is not documentation until it survives the
      # rollup: `stripInternal` deletes a declaration outright when `@internal` appears in
      # its leading comments, and the rollup relocates comments on its own. Measured here:
      # the module header of `auth-github/src/index.ts` was re-anchored onto the exported
      # `GitHubAuthError` class, where its `@theokit/...` first line was parsed as a tag and
      # swallowed the whole block. Source-side, that package looked documented; the file a
      # consumer installs had nothing.
      #
      # Order is deliberate. `doc-orphans` reads source only and is the cheapest, so it
      # fails first and points at a line someone can edit. `doc-api` compiles a probe per
      # documented import and is the slowest. Credential-free and network-free — a README
      # that does not compile is ours, not a provider's bad afternoon.
      - name: Documentation gates (drift, orphans, coverage)
        run: pnpm quality:docs

      # The bump derivation in rules/cycle-release.md reads the [Unreleased] category sections.
      # It assumes each names one place in the file; two edits once appended a second full set of
      # headings and nothing objected (#100).
      - name: CHANGELOG structure gate ([Unreleased] categories)
        run: pnpm quality:changelog

      # Fails only when a HIGH advisory reaches a package's RUNTIME chain. All nineteen in this
      # workspace enter through a devDependency — measured from the manifests, not assumed — so this
      # is green today. Deliberately: a gate red on arrival over findings nobody can act on gets
      # allowlisted wholesale or deleted, and then the real one is invisible too.
      #
      # It lives in this job rather than in `test` so a registry outage does not read as a test
      # failure.
      #
      # The cross-check `rules/deps-audit-golden-rule.md § 5` names for npm (B-034).
      #
      # Fetched as a RELEASE BINARY verified against the release's own SHA256SUMS, not as an
      # action. `google/osv-scanner-action`'s `action.yml` carries no `runs:` — it is metadata, and
      # a `uses:` pointing at it fails. What that repository actually ships is reusable WORKFLOWS,
      # which run as a job and upload SARIF; they cannot hand results back to the gate below, and
      # the gate is the thing that has to compare the two scanners. Both facts were read from the
      # repository, because the earlier attempt at this line was written from memory
      # (`google/osv-scanner-action/setup-action@v2.2.3`) and every part of it was wrong — the
      # path does not exist and the SHA was invented. That near-miss is why B-034 exists.
      #
      # A pinned version plus a verified checksum is the honest equivalent of a SHA pin for a
      # downloaded artifact: `shasum -c` fails the step if the bytes are not the ones measured on
      # 2026-08-24 against v2.5.1.
      - name: Fetch osv-scanner (pinned, checksum-verified)
        env:
          OSV_VERSION: v2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $RUNNER_TEMP/osv-scanner" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      # `|| true`: the scanner exits non-zero when it FINDS something, which is not a failure of
      # this step — the gate below decides what matters, on runtime reachability rather than on
      # presence. Losing that distinction is what makes a vulnerability gate get switched off.
      - name: Scan the lockfile with osv-scanner
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile pnpm-lock.yaml \
            --format json > "$RUNNER_TEMP/osv.json" || true

      - name: Dependency advisories gate (runtime chains only)
        env:
          OSV_RESULTS: ${{ runner.temp }}/osv.json
        run: pnpm quality:deps

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags, or the release-drift gate is inert exactly where it is wired. `actions/checkout`
          # defaults to `fetch-depth: 1` and fetches with `--no-tags`, so `quality:changelog` took
          # its no-tags branch on every run and reported that it had not checked — honest on
          # stdout, invisible under a green check mark. `fetch-tags` is cheaper than
          # `fetch-depth: 0`, which would pull the whole history for one comparison.
          fetch-tags: true
      # The install spine — Node, the package manager this repository DECLARES, a cache keyed
      # so it cannot outlive that manager, and a frozen install. Shared because it was the
      # same four steps in nine repositories, and because the knowledge inside them was not:
      # theokit-sdk pinned pnpm 9.15.0 in four workflows while its manifest said 10.34.1, so
      # every gate there validated a tree no contributor had (usetheokit/theokit-sdk#415).
      #
      # @v1 is a moving major and the blanket SHA-pinning policy is suppressed for it: that
      # policy defends against a THIRD PARTY moving a ref under us, and this is the same
      # organisation. What a SHA would buy is a guarantee we already have; what it would cost
      # is one correction becoming nine pull requests. What the action RUNS stays pinned —
      # every action inside it by digest, and the package manager by this repository's manifest.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      # Cross-package imports resolve through each package's `exports` map, which points
      # at `dist/` — so the workspace has to be BUILT before anything type-aware or
      # runtime-loading touches it. Skipping this is invisible on a developer machine
      # that has a stale `dist/` lying around, and fails only in CI: measured here as
      # `Failed to resolve entry for package "@theokit/auth-magic-link"` and as a wall of
      # `type that could not be resolved` from typescript-eslint.
      - name: Build all packages (types the other gates resolve against)
        run: pnpm build

      - run: pnpm test

      # Nothing measured coverage in this repository until 2026-08-22: no provider was
      # installed and the floor in rules/code-quality-thresholds.txt was commented out. The
      # numbers found on the first run ranged from 58.82% to 97.74%, and plugin-forms — the
      # lowest — had never mounted either of its components.
      - name: Coverage floor (80% lines, per package)
        run: pnpm coverage

  # SonarQube Cloud, from CI rather than Automatic Analysis.
  #
  # Automatic Analysis does not import coverage — its documentation states that "code coverage
  # information is not supported" — so on that mechanism the quality gate could not see the
  # per-package floor the `test` job above already enforces at 80%.
  #
  # The workflow lives in shared-workflows rather than as a step here, because the only inline
  # version in the ecosystem was dead on arrival: `if: matrix.node-version == '22.x'` against a
  # matrix of ['22.12', '22'], reporting `skipped` on every run for two months. A skipped step and
  # a passing step render identically.
  #
  # Automatic Analysis is OFF for this project in SonarCloud, which the scanner requires rather
  # than prefers: "You are running CI analysis while Automatic Analysis is enabled."
  sonar:
    needs: test
    # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
    # caller without eleven pull requests, which is the reason that repository exists.
    uses: usetheokit/shared-workflows/.github/workflows/sonar.yml@v1 # zizmor: ignore[unpinned-uses]
    # Named rather than inherited: `secrets: inherit` would hand the scanner every secret
    # this repository holds.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      coverage-command: pnpm coverage
