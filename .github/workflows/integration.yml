name: E2E (live)

# Live tests against the real provider APIs, with real credentials.
#
# Deliberately NOT on pull_request. Three reasons, each sufficient:
#
#  - Secrets are not available to workflows triggered by a fork PR, so the suite
#    would skip everything and report a green tick that means nothing.
#  - These send real email and spend real money on every run (LLM tokens, TTS
#    characters).
#  - A provider having a bad afternoon is not a reason to turn a contributor's PR
#    red. `ci.yml` is the gate for changes; this one watches the contracts.
#
# It runs nightly, so a provider changing its API surface is found by a schedule
# rather than by a user, and on demand when you want to confirm a fix.

on:
  schedule:
    # 04:00 UTC — outside working hours in America/Sao_Paulo, where the throwaway
    # mailboxes and Stripe test data live.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: 'Single service id (email, payments, copilot, voice, …). Empty runs all.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Never two live runs at once: they would race for the same provider rate
  # limit and, for email, interleave into the same mailbox.
  group: integration-live
  cancel-in-progress: false

jobs:
  live:
    name: Live provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scopes the secrets to this workflow rather than the whole repository.
    # NOT renamed with the directory: this is a GitHub Environment declared in repo
    # settings, and the name here must match it. Renaming one side alone breaks the
    # job by pointing at an environment that does not exist.
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      # The suites import the plugins by their public entry points, which come
      # from dist/.
      - run: pnpm build

      # Always runs, with or without secrets: it prints which services are wired
      # up and what each missing one still needs. When a credential expires this
      # is the line in the log that says so.
      - name: Readiness report
        run: pnpm integration:readiness
        env:
          E2E_LIVE: '1'
          # Same names as `integration/.env`, so a suite never knows which source it got.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
          # Must be sk_test_… — the harness refuses a live key outright rather
          # than handling it carefully.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          STRIPE_TEST_RECURRING_PRICE_ID: ${{ secrets.STRIPE_TEST_RECURRING_PRICE_ID }}
          ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
          ABACATEPAY_TEST_PRODUCT_ID: ${{ secrets.ABACATEPAY_TEST_PRODUCT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COPILOT_TEST_MODEL: ${{ secrets.COPILOT_TEST_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_TEST_TTS_VOICE: ${{ secrets.VOICE_TEST_TTS_VOICE }}
          # Optional: only lights up the Groq STT backend.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GH_OAUTH_CALLBACK_URL: ${{ secrets.GH_OAUTH_CALLBACK_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}

      # plugin-copilot's real-LLM probe lives in its own package, because it needs
      # an in-memory provider fixture that is not exported. It is gated on
      # E2E_LIVE as well as the key, so `pnpm test` cannot reach it — which also
      # means the nightly has to invoke it explicitly or it never runs at all.
      - name: Live suite that lives in its package (copilot real LLM)
        run: pnpm --filter @theokit/plugin-copilot exec vitest run tests/integration/copilot-real-llm.test.ts
        env:
          E2E_LIVE: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Live suites
        # The dispatch input reaches the shell as an environment variable, never as
        # text spliced into the script. `${{ inputs.x }}` inside a run block is
        # substituted before bash sees the line, so a value containing a shell
        # metacharacter executes as code with whatever secrets this step holds.
        run: |
          if [ -n "$SERVICE" ]; then
            pnpm --filter @theokit/plugins-integration exec vitest run "tests/$SERVICE"
          else
            pnpm integration
          fi
        env:
          SERVICE: ${{ inputs.service }}
          E2E_LIVE: '1'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_PRICE_ID: ${{ secrets.STRIPE_TEST_PRICE_ID }}
          STRIPE_TEST_RECURRING_PRICE_ID: ${{ secrets.STRIPE_TEST_RECURRING_PRICE_ID }}
          ABACATEPAY_API_KEY: ${{ secrets.ABACATEPAY_API_KEY }}
          ABACATEPAY_TEST_PRODUCT_ID: ${{ secrets.ABACATEPAY_TEST_PRODUCT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COPILOT_TEST_MODEL: ${{ secrets.COPILOT_TEST_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_TEST_TTS_VOICE: ${{ secrets.VOICE_TEST_TTS_VOICE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GH_OAUTH_CALLBACK_URL: ${{ secrets.GH_OAUTH_CALLBACK_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
